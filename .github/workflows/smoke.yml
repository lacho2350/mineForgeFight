name: smoke

on:
  push:
    branches: [ci-smoke]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Start the web dev server
        env:
          CI: ''
          EXPO_NO_TELEMETRY: '1'
        run: |
          nohup npx expo start --web --port 8081 > expo.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8081; then echo up; break; fi
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:8081 || (cat expo.log; exit 1)
      - name: Smoke test
        run: node scripts/smoke.mjs
      - name: Show logs
        if: always()
        run: |
          echo "=== errors.log ==="; cat smoke/errors.log || true
          echo; echo "=== console.log (tail) ==="; tail -n 80 smoke/console.log || true
          echo; echo "=== expo.log (tail) ==="; tail -n 40 expo.log || true
      - name: Publish the results to the ci-smoke-results branch
        if: always()
        run: |
          set -e
          cp expo.log smoke/ || true
          cd smoke
          git init -q
          git checkout -q -b ci-smoke-results
          git config user.name "smoke"
          git config user.email "smoke@localhost"
          git add -A
          git commit -q -m "smoke results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-smoke-results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
