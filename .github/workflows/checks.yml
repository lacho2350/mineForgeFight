# Typecheck, lint and test on every push — the same three checks AGENTS.md asks for before any task is done.
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        id: tsc
        run: npx tsc --noEmit
        continue-on-error: true
      - name: Lint
        id: lint
        run: npx expo lint
        continue-on-error: true
      - name: Test
        id: test
        # Failures are repeated as annotations (readable from the run page and the API without the log).
        run: |
          set -o pipefail
          npm test -- --ci --json --outputFile=/tmp/jest.json 2>&1 | tail -n 120 || true
          node -e '
            const r = require("/tmp/jest.json");
            for (const file of r.testResults) {
              for (const t of file.assertionResults) {
                if (t.status !== "failed") continue;
                const msg = t.failureMessages.join(" | ").replace(/\u001b\[[0-9;]*m/g, "").replace(/\s+/g, " ").slice(0, 1500);
                console.log(`::error file=${file.name.replace(process.cwd() + "/", "")},title=${t.fullName.replace(/[,:]/g, " ")}::${msg}`);
              }
              if (file.status === "failed" && file.assertionResults.length === 0) console.log(`::error file=${file.name.replace(process.cwd() + "/", "")}::${String(file.message).replace(/\u001b\[[0-9;]*m/g, "").replace(/\s+/g, " ").slice(0, 1500)}`);
            }
            process.exit(r.success ? 0 : 1);
          '
        continue-on-error: true
      - name: Result
        if: steps.tsc.outcome != 'success' || steps.lint.outcome != 'success' || steps.test.outcome != 'success'
        run: |
          echo "tsc: ${{ steps.tsc.outcome }}, lint: ${{ steps.lint.outcome }}, test: ${{ steps.test.outcome }}"
          exit 1
