# Typecheck, lint and test on every push — the same three checks AGENTS.md asks for before any task is done.
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        id: tsc
        run: npx tsc --noEmit
        continue-on-error: true
      - name: Lint
        id: lint
        run: npx expo lint
        continue-on-error: true
      - name: Test
        id: test
        run: npm test -- --ci
        continue-on-error: true
      - name: Result
        if: steps.tsc.outcome != 'success' || steps.lint.outcome != 'success' || steps.test.outcome != 'success'
        run: |
          echo "tsc: ${{ steps.tsc.outcome }}, lint: ${{ steps.lint.outcome }}, test: ${{ steps.test.outcome }}"
          exit 1
