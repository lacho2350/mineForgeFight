name: web-build

on:
  push:
    branches: [ci-smoke]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Export the web build
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npx expo export --platform web --output-dir dist
      - name: Make every path relative, serve CanvasKit from the build
        run: |
          set -e
          ls -la dist; find dist -type f | head -50
          echo "--- canvaskit ---"; ls node_modules/canvaskit-wasm/bin/full/ ; cat node_modules/canvaskit-wasm/package.json | grep '"version"'
          cp node_modules/canvaskit-wasm/bin/full/canvaskit.wasm dist/canvaskit.wasm
          echo "--- absolute refs in the bundle (before) ---"
          grep -o '"/_expo/[^"]*"' dist/_expo/static/js/web/*.js | sort | uniq -c | head -20 || true
          grep -o '"/assets/[^"]*"' dist/_expo/static/js/web/*.js | sort | uniq -c | head -5 || true
          grep -o 'https://cdn.jsdelivr.net/npm/canvaskit-wasm[^`"]*' dist/_expo/static/js/web/*.js | sort | uniq -c || true
          for f in dist/_expo/static/js/web/*.js; do
            sed -i 's#"/_expo/#"_expo/#g; s#"/assets/#"assets/#g; s#https://cdn.jsdelivr.net/npm/canvaskit-wasm@[0-9.]*/bin/full/##g' "$f"
          done
          sed -i 's#"/_expo/#"_expo/#g; s#"/assets/#"assets/#g; s#"/favicon#"favicon#g' dist/index.html
          echo "--- index.html ---"; cat dist/index.html
          echo "--- absolute refs left ---"
          grep -o '"/[_a-z][^"]*"' dist/_expo/static/js/web/*.js | sort | uniq -c | sort -rn | head -20 || true
          du -sh dist; find dist -type f | wc -l
      - name: Publish the build to the ci-smoke-results branch
        run: |
          set -e
          cd dist
          git init -q
          git checkout -q -b ci-smoke-results
          git config user.name "web-build"
          git config user.email "web-build@localhost"
          git add -A
          git commit -q -m "web export for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-smoke-results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
